project:
  title:        "J04 — Bộ điều khiển bốn LED 7 đoạn theo phương pháp quét đa hợp"        
  author:       "Phạm Minh Hoàng (24100665)"
  discord:      ""
  description:  "Làm quen với các chân vào/ra, các thanh ghi, và phương pháp quét đa hợp để điều khiển bốn LED 7 đoạn."
  language:     "Verilog"
  clock_hz:     1000000

  # Kích thước ô. 1x1 đủ cho hầu hết đề; đề nhóm J có thể cần 2x1.
  tiles: "1x1"

  # Tên module PHẢI khớp đúng tên trong src/project.v
  top_module: "tt_um_eee703128_24100665"

  source_files:
    - "project.v"

# ── Đặt tên chân · lấy theo cột "Giao diện" của đề em ────────────────────────
# Chân nào không dùng thì để chuỗi rỗng "".
pinout:
  ui[0]: "BCD digit low nibble, bit 0"
  ui[1]: "BCD digit low nibble, bit 1"
  ui[2]: "BCD digit low nibble, bit 2"
  ui[3]: "BCD digit low nibble, bit 3"
  ui[4]: "BCD digit high nibble, bit 0"
  ui[5]: "BCD digit high nibble, bit 1"
  ui[6]: "BCD digit high nibble, bit 2"
  ui[7]: "BCD digit high nibble, bit 3"

  uo[0]: "7-segment g, active low"
  uo[1]: "7-segment f, active low"
  uo[2]: "7-segment e, active low"
  uo[3]: "7-segment d, active low"
  uo[4]: "7-segment c, active low"
  uo[5]: "7-segment b, active low"
  uo[6]: "7-segment a, active low"
  uo[7]: "Unused, tied low"

  uio[0]: "Brightness PWM bit 0, input"
  uio[1]: "Brightness PWM bit 1, input"
  uio[2]: "Brightness PWM bit 2, input"
  uio[3]: "Load strobe, input"
  uio[4]: "Digit 0 select, active low, output"
  uio[5]: "Digit 1 select, active low, output"
  uio[6]: "Digit 2 select, active low, output"
  uio[7]: "Digit 3 select, active low, output"
